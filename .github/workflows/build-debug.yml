name: Build Debug APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    # Run only if commit message contains [debug] OR if manually triggered via workflow_dispatch
    if: contains(github.event.head_commit.message, '[debug]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          cd app-android
          cat <<EOF > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x app-android/gradlew

      - name: Build Debug APK
        run: |
          cd app-android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
